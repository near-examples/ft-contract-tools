[package]
name = "ft-contract-tools"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"
near-sdk-contract-tools = "4.0.0"

[dev-dependencies] 
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
near-api = "0.8.6"
near-sandbox = "0.3"
anyhow = "1.0"
tokio = { version = "1.41.0", features = ["full"] }
cargo-near-build = "0.11.5"
near-contract-standards = "=5.29.1"
